<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TV Wall</title>
<link rel="stylesheet" href="style.css" />
<!-- Auto-generated from wall_template_default.jpg on every server start
     (server/services/zonePositions.js) - loaded after style.css so its
     :root values win. -->
<link rel="stylesheet" href="zone-positions.css" />
</head>
<body>
  <div class="wall" id="wall">
    <img class="wall-background" src="assets/wall-background.jpg" alt="" />

    <div class="zone zone-middle" id="zone-middle">
      <div class="media-slot" id="mode-webcam">
        <video id="webcam-video" autoplay playsinline muted></video>
      </div>
      <div class="media-slot" id="mode-playlist">
        <video class="fit-contain" id="middle-video" playsinline muted></video>
        <img class="fit-cover blur-backdrop" id="middle-image-blur" alt="" />
        <img class="fit-contain" id="middle-image-fg" alt="" />
      </div>
      <div class="media-slot feed-unavailable" id="mode-feed-unavailable">
        <div class="icon">&#9888;</div>
        <div class="label">Feed Unavailable</div>
      </div>
    </div>

    <!-- Left box: upcoming events, from media/<campus>/*_upcoming_events.json,
         driven by EventsPlayer in app.js -->
    <div class="zone zone-left zone-left-events" id="zone-left">
      <div class="event-card" id="event-card"></div>
    </div>

    <!-- Right boxes ("Recent Moments"): synchronized rotation from
         media/<campus>/recent/, driven by RecentPlayer in app.js -->
    <div class="zone zone-right-top" id="zone-right-top">
      <img class="fit-contain" id="recent-top" alt="" />
    </div>
    <div class="zone zone-right-middle" id="zone-right-middle">
      <img class="fit-contain" id="recent-middle" alt="" />
    </div>
    <div class="zone zone-right-bottom" id="zone-right-bottom">
      <img class="fit-contain" id="recent-bottom" alt="" />
    </div>

    <!-- News ticker: full-width overlay, on top of every zone, not part of
         the template's 5 boxes. Content from media/<campus>/newstick*.txt,
         driven by NewsTicker in app.js. -->
    <div class="news-ticker" id="news-ticker">
      <div class="news-ticker-track" id="news-ticker-track"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
