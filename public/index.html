<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TV Wall</title>
<link rel="stylesheet" href="style.css?v=fullscreen2" />
<!-- Auto-generated from wall_template_default.jpg on every server start
     (server/services/zonePositions.js) - loaded after style.css so its
     :root values win. -->
<link rel="stylesheet" href="zone-positions.css" />
</head>
<body>
  <div class="wall" id="wall">
    <img class="wall-background" src="assets/wall-background.jpg" alt="" />

    <div class="zone zone-middle" id="zone-middle">
      <div class="media-slot" id="mode-webcam">
        <video id="webcam-video" autoplay playsinline muted></video>
      </div>
      <div class="media-slot" id="mode-playlist">
        <video class="fit-contain" id="middle-video" playsinline muted></video>
        <img class="fit-cover blur-backdrop" id="middle-image-blur" alt="" />
        <img class="fit-contain" id="middle-image-fg" alt="" />
      </div>
      <div class="media-slot feed-unavailable" id="mode-feed-unavailable">
        <div class="icon">&#9888;</div>
        <div class="label">Feed Unavailable</div>
      </div>
    </div>

    <!-- Upcoming (left): plain white-text overlay (no card background of
         its own - see .zone-left in style.css) over whatever's baked into
         wall_background.jpg at this spot. Text cards from
         media/<campus>/events.json's `events` array, driven by EventsPlayer
         in app.js -->
    <div class="zone zone-left" id="zone-left">
      <div class="event-card" id="event-card"></div>
    </div>

    <!-- Recent (right): titled event photos from events.json, then orphan
         images in recent/; if nothing to show, white "coming soon".
         Title sits above the box (same width), driven by RecentEventsPlayer. -->
    <div class="recent-event-title" id="recent-event-title"></div>
    <div class="zone zone-right" id="zone-right">
      <img class="fit-contain" id="recent-photo" alt="" />
      <div class="recent-coming-soon" id="recent-coming-soon">coming soon</div>
    </div>

    <!-- News ticker: full-width overlay, on top of every zone, not part of
         the template's 3 boxes. Content from media/<campus>/newstick*.txt,
         driven by NewsTicker in app.js. -->
    <div class="news-ticker" id="news-ticker">
      <div class="news-ticker-track" id="news-ticker-track"></div>
    </div>

    <!-- Fullscreen override: covers the entire canvas (zones + ticker)
         during a scheduled window or Force On from /control. Media from
         media/<campus>/fullscreen_img/. -->
    <div class="fullscreen-overlay" id="fullscreen-overlay" aria-hidden="true">
      <video id="fullscreen-video" class="fit-contain" playsinline muted loop></video>
      <img id="fullscreen-image" class="fit-contain" alt="" />
    </div>
  </div>
  <script src="app.js?v=fullscreen2"></script>
</body>
</html>
